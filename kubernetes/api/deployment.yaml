apiVersion: apps/v1
kind: Deployment
metadata:
  name: task-api
spec:
  selector:
    matchLabels:
      app: task-api
  replicas: 3
  template:
    metadata:
      labels:
        app: task-api
    spec:
      containers:
        - name: task-api
          image: task-api:v3
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 2
            timeoutSeconds: 2
            failureThreshold: 15
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 15
          resources:
            requests:
              cpu: "100m"
              memory: "50Mi"
            limits:
              cpu: "300m"
              memory: "123Mi"
          envFrom:
            - configMapRef:
                name: task-api-config
            - secretRef:
                name: task-api-secret
            - secretRef:
                name: task-api-db-secret
