apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler

metadata:
  name: task-api-hpa
spec:
  scaleTargetRef:
    apiVersion: app/v1
    kind: Deployment
    name: task-api
  minReplicas: 2
  maxReplicas: 10

  metrics:
    - type: Resource

      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
