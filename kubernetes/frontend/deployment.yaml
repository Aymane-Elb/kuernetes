apiVersion: apps/v1
kind: Deployment
metadata:
  name: task-frontend
  namespace: default
spec:
  selector:
    matchLabels:
      app: task-frontend
  replicas: 3
  template:
    metadata:
      labels:
        app: task-frontend
    spec:
      containers:
        - name: task-frontend
          image: task-frontend:v1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
