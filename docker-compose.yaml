services:
  api:
    build:
      context: ./app/api
      dockerfile: Dockerfile

    container_name: task-api

    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./app/frontend
      dockerfile: Dockerfile

    container_name: task-frontend

    ports:
      - "3000:80"

    depends_on:
      - api
